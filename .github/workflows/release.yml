name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: photon_count_adjuster-macos
            archive: target/release/photon_count_adjuster-macos.zip
          - os: windows-2022
            artifact: photon_count_adjuster-windows
            archive: target/release/photon_count_adjuster-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-26
      - run: cargo build --release --locked
      - name: Bundle macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p "target/release/Photon Count Adjuster.app/Contents/MacOS" "target/release/Photon Count Adjuster.app/Contents/Resources"
          cp target/release/photon_count_adjuster "target/release/Photon Count Adjuster.app/Contents/MacOS/"
          cp macos/Info.plist "target/release/Photon Count Adjuster.app/Contents/"
          cp macos/AppIcon.icns "target/release/Photon Count Adjuster.app/Contents/Resources/"
          version="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$version" "target/release/Photon Count Adjuster.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$version" "target/release/Photon Count Adjuster.app/Contents/Info.plist"
          codesign --force --sign - --timestamp=none "target/release/Photon Count Adjuster.app"
          codesign --verify --deep --strict --verbose=2 "target/release/Photon Count Adjuster.app"
          ditto -c -k --sequesterRsrc --keepParent "target/release/Photon Count Adjuster.app" target/release/photon_count_adjuster-macos.zip
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/photon_count_adjuster.exe -DestinationPath target/release/photon_count_adjuster-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/photon_count_adjuster-macos/photon_count_adjuster-macos.zip
          artifacts/photon_count_adjuster-windows/photon_count_adjuster-windows.zip
          --repo "${{ github.repository }}"
          --title "Release ${{ github.ref_name }}"
          --generate-notes
