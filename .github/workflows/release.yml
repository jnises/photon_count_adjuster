name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: photon_count_adjuster-macos
            binary: target/release/photon_count_adjuster
          - os: windows-2022
            artifact: photon_count_adjuster-windows
            binary: target/release/photon_count_adjuster.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package binaries
        run: |
          chmod +x artifacts/photon_count_adjuster-macos/photon_count_adjuster
          zip -j photon_count_adjuster-macos.zip artifacts/photon_count_adjuster-macos/photon_count_adjuster
          zip -j photon_count_adjuster-windows.zip artifacts/photon_count_adjuster-windows/photon_count_adjuster.exe
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          photon_count_adjuster-macos.zip
          photon_count_adjuster-windows.zip
          --repo "${{ github.repository }}"
          --title "Release ${{ github.ref_name }}"
          --generate-notes
