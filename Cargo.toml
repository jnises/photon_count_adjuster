[package]
authors = ["joel nises <joel.nises@gmail.com>"]
build = "build.rs"
edition = "2024"
name = "photon_count_adjuster"
version = "2.1.1"

[profile.release]
lto = true
opt-level = "s" # Optimize for size.
panic = "abort"
strip = true

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }

# TODO: Replace ddc-hi with direct ddc-macos/ddc-winapi backends to remove its future-incompatible EDID/MCCS parser dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-macos"] }

[target.'cfg(windows)'.dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-winapi"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
