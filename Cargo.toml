[package]
authors = ["joel nises <joel.nises@gmail.com>"]
build = "build.rs"
edition = "2024"
name = "photon_count_adjuster"
version = "2.1.2"

[profile.release]
lto = true
opt-level = "s" # Optimize for size.
panic = "abort"
strip = true

[dependencies]
ddc = "0.2.2"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_os = "macos")'.dependencies]
ddc-macos = "0.2.2"

[target.'cfg(windows)'.dependencies]
ddc-winapi = "0.2.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
